<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Journal — ZOE Studios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
  <canvas id="dustCanvas"></canvas>

  <header>
    <div class="header-inner">
      <a href="index.html" class="brand">
        <div class="brand-text">
          <span class="brand-name" id="siteName">ZOE</span>
          <span class="brand-sub" id="siteTagline">Studios</span>
        </div>
      </a>

      <nav>
        <a href="index.html">Archives</a>
        <a href="tools.html">Catalog</a>
        <a href="faq.html" class="active">Journal</a>
      </nav>

      <div class="header-actions">
        <button class="ham-btn" id="hamBtn">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <div class="mob-menu" id="mobMenu">
    <a href="index.html">Archives</a>
    <a href="tools.html">Catalog</a>
    <a href="faq.html">Journal</a>
  </div>

  <main>
    <section class="hero" style="min-height: 40vh; padding-bottom: 2rem;">
      <div class="hero-dim"></div>
      
      <div class="breadcrumb">
        <a href="index.html">INDEX</a>
        <span class="sep">/</span>
        <span>JOURNAL</span>
      </div>
      
      <h1>
        THE<br>
        <em>Journal</em>
      </h1>
      <p class="hero-desc">
        A record of inquiries, anomalies, and resolutions.
      </p>

      <div class="search-bar">
        <input type="text" id="faqSearch" placeholder="Query the journal..." oninput="filterFAQ(this)">
        <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </div>
    </section>

    <hr class="divider">

    <section>
      <div class="tags reveal" style="justify-content: center; margin-top: 3rem;">
        <button class="tag active" onclick="setFaqTag('all', this)">ALL QUERIES</button>
        <button class="tag" onclick="setFaqTag('errors', this)">ANOMALIES</button>
        <button class="tag" onclick="setFaqTag('emulators', this)">MACHINES</button>
        <button class="tag" onclick="setFaqTag('settings', this)">CALIBRATION</button>
      </div>

      <div class="journal" id="journalList">
        <!-- Rendered by JS -->
      </div>
    </section>
  </main>

  <button class="scroll-top" id="scrollTop">↑</button>

  <footer>
    <div class="footer-inner">
      <span class="footer-brand" id="footerBrand">ZOE Studios</span>
      <div class="footer-links">
        <a href="index.html">Archives</a>
        <a href="tools.html">Catalog</a>
        <a href="faq.html">Journal</a>
      </div>
      <div class="footer-copy">© 2026 ZOE STUDIOS. ALL RIGHTS RESERVED.</div>
    </div>
  </footer>

  <script src="js/data.js?v=4"></script>
  <script src="js/dust.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
