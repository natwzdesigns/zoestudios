<body class="smooth-scroll">

  <canvas id="dustCanvas"></canvas>

          <span class="brand-sub" id="siteTagline">Studios</span>

        <a href="tools.html">Catalog</a>

      <div class="header-actions">
        <button class="ham-btn" id="hamBtn">
          <span></span><span></span><span></span>

    </div>

    <a href="index.html">Archives</a>
    <a href="tools.html">Catalog</a>
    <a href="faq.html">Journal</a>

  <main>
    <div id="postLoading" class="container fade-in" style="padding: 10rem 0; text-align: center; font-family: 'Courier Prime', monospace; letter-spacing: 2px;">

          <span id="postDate"></span> &mdash; <span id="postTime"></span>
        </p>
      </section>

      <hr class="divider">

      <section class="container fade-in" style="max-width: 800px; margin: 0 auto; padding: 0 1.5rem 6rem;">
        <div id="postMediaContainer" style="margin-bottom: 3rem;">
          <!-- Cover image or video injected via JS -->
        </div>

        <div id="postContent" class="vintage-content">
          <!-- Markdown HTML injected via JS -->
        </div>
      </section>

  <button class="scroll-top" id="scrollTop">↑</button>
